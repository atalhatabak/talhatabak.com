# talhatabak.com: the static site built by Hugo, copied to /opt/www/talhatabak.com
# by tools/deploy/deploy.sh. Goes to /etc/nginx/vhost.d/vhost_talhatabak.com.conf on the
# server. HTTP -> HTTPS and the ACME challenge are handled by 00-default.conf.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name talhatabak.com;

    ssl_certificate     /etc/letsencrypt/live/talhatabak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talhatabak.com/privkey.pem;

    include /etc/nginx/templates/misc.tmpl;

    root /opt/www/talhatabak.com;
    error_page 404 /404.html;

    location /tr/ {
        error_page 404 /tr/404.html;
    }
}

# www.talhatabak.com -> talhatabak.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.talhatabak.com;

    ssl_certificate     /etc/letsencrypt/live/talhatabak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talhatabak.com/privkey.pem;

    return 301 https://talhatabak.com$request_uri;
}
